name: CI

# Spec #3 §5.2 instrument 2: the synthetic known-truth harness is the engine's statistical
# regression suite and is meant to run on every engine change. It lives in
# packages/calibration's default test run, so gating on the workspace suite gates on it.
#
# WHAT THIS GATE DOES AND DOES NOT MEAN.
# It asserts MONOTONICITY and EFFECT-SIZE FLOORS — better attribute, better outcome, always —
# never realism. Every Tier 1 baseline metric is currently outside its band for reasons the
# twenty-two entries in docs/decisions/CALIBRATION-BACKLOG.md own and name. A red baseline is
# expected; a broken ladder is not. Do not add a realism assertion here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# TWO JOBS, RUN SIDE BY SIDE (2026-10, CI speed). A single job took ~5 minutes, and ~80% of
# the test time is @ff/calibration's known-truth ladders. `checks` runs everything except
# calibration's tests; `calibration` runs calibration's whole suite split three ways by vitest's
# --shard. Every test file still runs exactly once:
#   - test:ci-rest excludes ONE named package, so a new package is included without an edit,
#     and it runs the workspace-coverage assertion first, as `pnpm test` does.
#   - vitest's shards partition calibration's files: shard i/3 takes its share, and the three
#     shards together are the whole set. All three must pass (fail-fast off, so one red shard
#     cannot hide another's result).
# The floor is the slowest single file (the db-coverage ladder, ~2.5 min on its own), not the
# sum, so more shards would not help. `pnpm test` and `pnpm verify` are unchanged.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # pnpm 11 refuses to run dependency build scripts until each is approved and treats an
      # unapproved script as fatal on every later command. esbuild is approved in
      # pnpm-workspace.yaml's allowBuilds — see HANDOFF §1.1.
      #
      # THE VERSION IS NAMED HERE because nothing else names one (package.json has no
      # `packageManager`), and action-setup@v4 fails the job rather than guess — which it did on
      # every run from August 2026 until this line. pnpm 11 needs Node 22.13 or later, hence 22
      # below.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck before tests: several guarantees in this repo are compile errors by design
      # (Charter §4.1), so a green test run against a tree that does not typecheck would be
      # reporting less than it appears to.
      #
      # CALL THE ROOT SCRIPTS — never inline the recursive command (ADR-038).
      # These steps previously ran `pnpm -r exec tsc --noEmit` and `pnpm -r test` directly.
      # That was a RESTATEMENT of package.json's scripts, and it drifted the moment they were
      # fixed: repairing the root `typecheck` would have left this gate — the one that actually
      # blocks — still running the broken command, while reporting the hole closed.
      # `pnpm typecheck` / `pnpm test` run the workspace-coverage assertion first, so a package
      # that declares no typecheck script fails here instead of being silently skipped.
      - name: Typecheck
        run: pnpm typecheck

      # The four dormant packages carry --passWithNoTests so the recursive run reaches the
      # packages that do have tests. Engine deliberately does NOT (HANDOFF §1.2).
      - name: Test (all packages but calibration)
        run: pnpm test:ci-rest

      # BUILD RUNS HERE AND NOWHERE ELSE — owner ruling, July 2026, backlog entry 60.
      #
      # ADR-038's coverage gate checks that every package DECLARES `build`, `test` and
      # `typecheck`. It does NOT check that any of them SUCCEEDS, and those two read identically
      # from a green run. `apps/game` declared `vite build` with no `index.html` and no
      # `vite.config.ts` committed: `pnpm -r build` had been failing while the coverage gate
      # reported the workspace covered.
      #
      # WHY THE FIX IS HERE AND NOT IN THE GATE. Making the coverage gate execute every package's
      # build would be slow, and SLOWNESS IS HOW GATES GET DISABLED — a disabled gate is worse
      # than a narrow one. CI is the layer that can afford it: here the cost is a wait, not a
      # habit. The coverage gate keeps doing the fast declaration check it is genuinely good at,
      # and its subject is now stated precisely in ADR-038 rather than assumed.
      - name: Build
        run: pnpm -r build

      # THE CONTRACTS HOOK IS NOT SELF-INSTALLING. `.githooks/commit-msg` enforces the
      # ADR-reference rule on packages/contracts, but git only runs it when
      # `core.hooksPath=.githooks` is configured — which is per-machine and NOT carried by a
      # clone. A fresh clone therefore has NO contracts guard, and CI is the only place that
      # can notice. This asserts the hook exists and is executable; it cannot assert that a
      # given developer installed it, which is why HANDOFF §1.3 states the install step.
      - name: Contracts hook present
        run: test -x .githooks/commit-msg || { echo "::error::.githooks/commit-msg missing or not executable"; exit 1; }

  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      # Same toolchain as `checks` above; the reasons for each pin are written there.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test (calibration, shard ${{ matrix.shard }} of 3)
        run: pnpm test:ci-calibration --shard=${{ matrix.shard }}/3
